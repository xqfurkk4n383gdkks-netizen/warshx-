<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>𝑾Á𝑹𝑺𝑯 | Free Fire Hassasiyet</title>
<style>
:root{--bg:#07020a;--card:#12060e;--tx:#f4e9ee;--mu:#a98a97;--r:#ff1744;--bd:#3a0a18;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100%}
canvas#bg{position:fixed;inset:0;z-index:0}
main{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:16px}
.logo{text-align:center;font-size:42px;font-weight:900;letter-spacing:3px;color:#fff;text-shadow:0 0 8px var(--r),0 0 22px var(--r),0 0 46px #b0002a;margin:8px 0 0}
@keyframes fl{0%,93%,100%{opacity:1}95%{opacity:.6}97%{opacity:1}98%{opacity:.7}}
.sub{text-align:center;color:var(--mu);font-size:13px;margin:4px 0 14px}
.badges{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-bottom:14px}
.badges span{font-size:11px;border:1px solid var(--r);color:var(--r);padding:3px 9px;border-radius:99px;box-shadow:0 0 8px #ff174455}
.card{background:rgba(18,6,14,.88);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 0 18px #ff17441a}
h2{font-size:14px;margin:0 0 10px;color:var(--r);letter-spacing:1px;text-transform:uppercase}
label{display:block;font-size:12px;color:var(--mu);margin:10px 0 5px}
.opts{display:flex;gap:6px;flex-wrap:wrap}
.opts button{flex:1;min-width:70px;background:#1b0812;color:var(--tx);border:1px solid var(--bd);padding:9px 6px;border-radius:9px;font-size:13px;cursor:pointer}
.opts button.on{border-color:var(--r);color:#fff;background:#3a0614;box-shadow:0 0 12px #ff174488}
.go{width:100%;margin-top:14px;padding:14px;font-size:16px;font-weight:800;letter-spacing:1px;color:#fff;background:linear-gradient(90deg,#b0002a,var(--r));border:0;border-radius:11px;cursor:pointer;box-shadow:0 0 22px #ff1744aa}
.go:active{transform:scale(.98)}
.log{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:#ff6b88;min-height:18px}
.bar{height:6px;background:#2a0914;border-radius:9px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;width:0;background:var(--r);box-shadow:0 0 10px var(--r);transition:width .3s}
.row{margin:9px 0}.row div{display:flex;justify-content:space-between;font-size:13px}.row b{color:var(--r);font-variant-numeric:tabular-nums}
.gauge{text-align:center}.gauge .n{font-size:54px;font-weight:900;color:#fff;text-shadow:0 0 14px var(--r)}.gauge small{color:var(--mu);display:block;font-size:11px}
.sm{display:flex;gap:6px;margin-top:10px}.sm button{flex:1;padding:10px;border-radius:9px;border:1px solid var(--r);background:transparent;color:var(--r);font-weight:700;cursor:pointer}
.hid{display:none}
#arena{position:relative;height:220px;background:#0b0309;border:1px solid var(--bd);border-radius:12px;overflow:hidden;touch-action:manipulation}
.t{position:absolute;width:38px;height:38px;border-radius:50%;background:radial-gradient(#fff 8%,var(--r) 10% 40%,#450012 42%);box-shadow:0 0 14px var(--r);cursor:pointer}
.stat{display:flex;justify-content:space-between;font-size:13px;margin-top:8px;color:var(--mu)}.stat b{color:#fff}
.hist div{font-size:12px;color:var(--mu);padding:6px 0;border-bottom:1px solid var(--bd)}
.tip{font-size:13px;line-height:1.5;color:var(--mu)}.tip b{color:var(--tx)}
footer{text-align:center;font-size:11px;color:var(--mu);padding:14px 0 24px}
